<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5005A6"/>
      <stop offset="100%" stop-color="#3b047a"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background Rounded Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#grad)"/>
  
  <!-- Outer decorative ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="10"/>
  
  <!-- Central circular plate with subtle shadow -->
  <circle cx="256" cy="256" r="165" fill="#ffffff" filter="url(#shadow)"/>
  <circle cx="256" cy="256" r="145" fill="none" stroke="#f3e8ff" stroke-width="6"/>

  <!-- Iconic Chef Hat / Catering Cloche & Utensils Emblem -->
  <!-- Fork & Spoon Stylized Gold / Purple -->
  <g transform="translate(256,256) scale(1.15) translate(-128,-128)">
    <!-- Spoon on left -->
    <path d="M96 68 C80 68 68 84 68 106 C68 128 80 144 96 144 C104 144 110 140 114 134 L114 200 C114 206 118 210 124 210 C130 210 134 206 134 200 L134 134 C138 140 144 144 152 144 C168 144 180 128 180 106 C180 84 168 68 152 68 C144 68 138 72 134 78 L134 50 C134 44 130 40 124 40 C118 40 114 44 114 50 L114 78 C110 72 104 68 96 68 Z" fill="#5005A6" opacity="0"/>
    
    <!-- Elegant Catering Cloche & Chef Motif -->
    <!-- Cloche dome -->
    <path d="M64 168 C64 110 100 80 128 72 C128 62 136 54 146 54 C156 54 164 62 164 72 C192 80 228 110 228 168 Z" fill="#5005A6"/>
    <!-- Cloche handle top ring -->
    <circle cx="146" cy="46" r="12" fill="none" stroke="#BA7517" stroke-width="6"/>
    <circle cx="146" cy="46" r="6" fill="#BA7517"/>
    <!-- Cloche platter line -->
    <rect x="52" y="172" width="188" height="14" rx="7" fill="#BA7517"/>
    
    <!-- Letter 'D' & Steam Accent -->
    <text x="146" y="148" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="52" fill="#ffffff" text-anchor="middle">D</text>
    
    <!-- Fork & Knife crossed below tray -->
    <path d="M84 196 L124 236 M124 196 L84 236" stroke="#5005A6" stroke-width="6" stroke-linecap="round"/>
    <circle cx="146" cy="216" r="8" fill="#5005A6"/>
    <path d="M168 196 L208 236 M208 196 L168 236" stroke="#5005A6" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Stars of Quality Catering -->
  <g fill="#BA7517">
    <path d="M256 70 L261 82 L274 83 L264 92 L267 104 L256 97 L245 104 L248 92 L238 83 L251 82 Z"/>
    <path transform="translate(196, 78) scale(0.7)" d="M256 70 L261 82 L274 83 L264 92 L267 104 L256 97 L245 104 L248 92 L238 83 L251 82 Z"/>
    <path transform="translate(316, 78) scale(0.7)" d="M256 70 L261 82 L274 83 L264 92 L267 104 L256 97 L245 104 L248 92 L238 83 L251 82 Z"/>
  </g>
</svg>
